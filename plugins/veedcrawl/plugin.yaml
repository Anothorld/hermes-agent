description: "Veedcrawl video intelligence — 8 tools over the Veedcrawl REST API. Discovery tools (metadata, extract, instagram_profile, search_social_videos) embed kol-ops-bridge monthly persist. Async transcript/extract jobs poll internally. Auth via VEEDCRAWL_API_KEY (X_API_KEY also accepted)."
author: agent_prj
kind: backend
provides_tools:
  - veedcrawl_account
  - veedcrawl_metadata
  - veedcrawl_transcript
  - veedcrawl_extract
  - veedcrawl_profile
  - veedcrawl_instagram_profile
  - veedcrawl_search_social_videos
  - veedcrawl_job
